# ─────────────────────────────────────────────────────────────────────────────
# SLI.pro / Wing — Azure DevOps pipeline (stage)
#
# Single-container deployment: the SPA, REST API and voice WebSocket are built
# into one image and served from one Container App.
#
#   validate → build image (ACR) → migrate (job) → deploy revision → health gate
#                                                              → point the scheduler job
#
# Prerequisites (see AZURE_DEVOPS_RUNBOOK.md):
#   - Service connection `slipro-azure-stage` using workload identity federation
#   - Variable group `slipro-stage` (values below), optionally Key Vault-linked
#   - Environment `slipro-stage` with an approval check on schema changes
# ─────────────────────────────────────────────────────────────────────────────

trigger:
  branches:
    include: [main, stage]
  paths:
    exclude: ["**/*.md", "attached_assets/**"]

pr:
  branches:
    include: [main]

variables:
  - group: slipro-stage          # AZURE_SUBSCRIPTION, ACR_NAME, RESOURCE_GROUP,
                                 # CONTAINER_APP_NAME, MIGRATE_JOB_NAME,
                                 # SCHEDULER_JOB_NAME
  - name: imageName
    value: slipro-api
  - name: imageTag
    value: $(Build.BuildId)-$(Build.SourceVersion)
  - name: nodeVersion
    value: '20.x'

stages:
# ── 1. Validate ──────────────────────────────────────────────────────────────
- stage: Validate
  displayName: Validate
  jobs:
  - job: check
    displayName: Typecheck and tests
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: Use Node $(nodeVersion)

    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: $(Pipeline.Workspace)/.npm
      displayName: Cache npm

    - script: npm ci --cache $(Pipeline.Workspace)/.npm
      displayName: Install dependencies

    # ── Typecheck: a ratchet, not a gate ─────────────────────────────────────
    #
    # The MVP carries pre-existing type errors, so a hard gate is not available
    # today — it would fail every build until all of them are cleared, which is
    # why this step was advisory. Advisory means new errors land unnoticed, and
    # they have: `error TS18048: 'req.user' is possibly undefined` appears 31
    # times in routes.ts alone.
    #
    # So it fails on an INCREASE instead. The baseline only ever goes down; when
    # somebody clears errors, they lower TYPECHECK_BASELINE in the same commit
    # and the ratchet holds the new floor. When it reaches 0, replace all of this
    # with `npx tsc --noEmit`.
    - script: |
        set -uo pipefail
        TYPECHECK_BASELINE=95
        npx tsc --noEmit > /tmp/tsc.log 2>&1 || true
        COUNT=$(grep -c "error TS" /tmp/tsc.log || true)
        echo "type errors: $COUNT (baseline $TYPECHECK_BASELINE)"
        if [ "$COUNT" -gt "$TYPECHECK_BASELINE" ]; then
          echo "##vso[task.logissue type=error]typecheck regressed: $COUNT errors, baseline $TYPECHECK_BASELINE"
          grep "error TS" /tmp/tsc.log | head -40
          exit 1
        fi
        if [ "$COUNT" -lt "$TYPECHECK_BASELINE" ]; then
          echo "##vso[task.logissue type=warning]typecheck improved to $COUNT — lower TYPECHECK_BASELINE to hold it"
        fi
      displayName: Typecheck (ratchet, baseline 95)

    # ── The whole contract suite, as one hard gate ───────────────────────────
    #
    # This used to run three suites by name — provenance, engine rules,
    # classifier rules — while `npm test` runs TEN. The seven not listed here
    # were therefore never enforced in CI, and one of them,
    # api-contracts.test.ts, carries eighteen static checks including the ones
    # that fail the build on a leaked credential shape, a migration missing from
    # drizzle's journal, an Anthropic import reappearing, or audio leaving the
    # Azure tenancy. The most important suite in the repo was the one CI did not
    # run.
    #
    # Every suite is pure functions reading source files — no database, no LLM,
    # no network — so there is no reason to be selective. Naming them
    # individually was the whole problem: a new suite is not covered until
    # somebody remembers to add a step, and nobody did.
    - script: npm test
      displayName: Contract and rule tests (all suites)

# ── 2. Build image ───────────────────────────────────────────────────────────
- stage: Build
  displayName: Build image
  dependsOn: Validate
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: acrBuild
    displayName: ACR build and push
    pool:
      vmImage: ubuntu-latest
    steps:
    # Build inside Azure: the image never leaves the tenant and the agent needs
    # no Docker credentials.
    - task: AzureCLI@2
      displayName: az acr build
      inputs:
        azureSubscription: slipro-azure-stage
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az acr build \
            --registry "$(ACR_NAME)" \
            --image "$(imageName):$(imageTag)" \
            --image "$(imageName):latest" \
            --file Dockerfile .

# ── 3. Migrate (gated) ───────────────────────────────────────────────────────
- stage: Migrate
  displayName: Database migrations
  dependsOn: Build
  condition: succeeded()
  jobs:
  # Deployment job so the `slipro-stage` environment's approval check applies —
  # schema changes should be a deliberate act.
  - deployment: migrate
    displayName: Apply migrations
    environment: slipro-stage
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          # The database is VNet-only, so a hosted agent cannot reach it.
          # Migrations run as a Container Apps job inside the VNet, using the
          # image just built and the app's managed identity.
          - task: AzureCLI@2
            displayName: Start migration job
            inputs:
              azureSubscription: slipro-azure-stage
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az containerapp job update \
                  --name "$(MIGRATE_JOB_NAME)" \
                  --resource-group "$(RESOURCE_GROUP)" \
                  --image "$(ACR_NAME).azurecr.io/$(imageName):$(imageTag)"

                EXEC=$(az containerapp job start \
                  --name "$(MIGRATE_JOB_NAME)" \
                  --resource-group "$(RESOURCE_GROUP)" \
                  --query name -o tsv)
                echo "Started execution: $EXEC"

                # Prints the migration container's own output. Without this the
                # pipeline reports "Failed" and discards the reason — the job
                # runs inside the VNet, so its stdout never reaches this log,
                # and diagnosing a broken deploy means going to the portal with
                # nothing to search for.
                #
                # `|| true` throughout: log retrieval is diagnostics. If the CLI
                # extension is missing or Log Analytics has not ingested yet,
                # that must not replace the real error with a different one.
                dump_logs() {
                  echo ""
                  echo "───── migration container output ─────"
                  az containerapp job logs show \
                    --name "$(MIGRATE_JOB_NAME)" \
                    --resource-group "$(RESOURCE_GROUP)" \
                    --container "$(MIGRATE_JOB_NAME)" \
                    --execution "$1" \
                    --tail 200 2>/dev/null || {
                    echo "  (could not fetch logs automatically — run this locally:)"
                    echo "  az containerapp job logs show --name $(MIGRATE_JOB_NAME) --resource-group $(RESOURCE_GROUP) --container $(MIGRATE_JOB_NAME) --execution $1"
                  }
                  echo "──────────────────────────────────────"
                  echo ""
                }

                # Poll to completion — a silent migration failure followed by a
                # successful app rollout is the worst possible outcome.
                for i in $(seq 1 60); do
                  STATUS=$(az containerapp job execution show \
                    --name "$(MIGRATE_JOB_NAME)" \
                    --resource-group "$(RESOURCE_GROUP)" \
                    --job-execution-name "$EXEC" \
                    --query properties.status -o tsv)
                  echo "  status: $STATUS"
                  case "$STATUS" in
                    Succeeded)
                      # Printed on success too: the migrator lists what it
                      # applied, and "0 applied" is worth seeing when a schema
                      # change appears not to have taken effect.
                      dump_logs "$EXEC"
                      exit 0 ;;
                    Failed|Degraded)
                      echo "Migration failed"
                      dump_logs "$EXEC"
                      exit 1 ;;
                  esac
                  sleep 10
                done

                echo "Migration did not finish within 10 minutes"
                dump_logs "$EXEC"
                exit 1

# ── 4. Deploy ────────────────────────────────────────────────────────────────
- stage: Deploy
  displayName: Deploy application
  dependsOn: Migrate
  condition: succeeded()
  jobs:
  - deployment: containerApp
    displayName: Container Apps revision
    environment: slipro-stage
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: Deploy revision and gate on health
            inputs:
              azureSubscription: slipro-azure-stage
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Revision-based: a bad rollout is reverted by activating the
                # previous revision, with no rebuild.
                az containerapp update \
                  --name "$(CONTAINER_APP_NAME)" \
                  --resource-group "$(RESOURCE_GROUP)" \
                  --image "$(ACR_NAME).azurecr.io/$(imageName):$(imageTag)"

                FQDN=$(az containerapp show \
                  --name "$(CONTAINER_APP_NAME)" \
                  --resource-group "$(RESOURCE_GROUP)" \
                  --query properties.configuration.ingress.fqdn -o tsv)

                echo "Probing https://$FQDN/api/health"
                for i in $(seq 1 30); do
                  if curl -fsS "https://$FQDN/api/health" > /dev/null; then
                    echo "Application healthy"
                    curl -sS "https://$FQDN/api/health/ready" || true
                    exit 0
                  fi
                  sleep 10
                done

                echo "Revision did not become healthy within 5 minutes."
                echo "Roll back with: az containerapp revision activate ..."
                exit 1

# ── 5. Scheduler ─────────────────────────────────────────────────────────────
#
# Everything Wing sends without being asked runs hourly as a Container Apps job
# from this same image — see AZURE_SCHEDULER.md for the resource and the cron.
#
# AFTER Deploy, and that ordering is the point: if the health gate above fails
# the app rolls back, and a scheduler already pointed at the new image would
# keep running the build that was just rejected against a live database.
#
# The job is not created here. Creating infrastructure from a deploy pipeline is
# how an environment gets rebuilt by accident; this only moves the image.
- stage: Scheduler
  displayName: Point the scheduler at this build
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - deployment: Scheduler
    displayName: Container Apps job image
    environment: slipro-stage
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: Update scheduler job image
            # ─────────────────────────────────────────────────────────────────
            # The scheduler job is created once, by hand, per environment
            # (AZURE_SCHEDULER.md). Stage does not have one and does not need one
            # — the cadence work is scoped to production — so this step SKIPS
            # when there is nothing to point at, rather than failing the build.
            #
            # It skips loudly. `SucceededWithIssues` turns the stage amber and
            # puts a line in the run summary, because a silent green build that
            # did not update the scheduler is how a production deploy ends up
            # running last week's image on a nightly cron.
            #
            # ── WHY THE VARIABLES ARE PASSED THROUGH `env:` ──────────────────
            # This is the actual bug in the 30 Aug run, and it is a trap worth
            # naming. Azure DevOps substitutes `$(FOO)` only for variables it
            # KNOWS; an undefined one is left in the script verbatim. Bash then
            # reads `$(SCHEDULER_JOB_NAME)` as command substitution and tries to
            # RUN a command by that name:
            #
            #     line 3: SCHEDULER_JOB_NAME: command not found
            #
            # The substitution yields an empty string, so `az containerapp job
            # show --name ""` ran, exited 0 without finding anything, the guard
            # passed, and `az containerapp job update` then died on
            # `KeyError: 'properties'` — a traceback about the CLI's internals
            # for what was really a missing variable-group value.
            #
            # `env:` values are not shell-evaluated, so an undefined variable
            # arrives as the literal text `$(SCHEDULER_JOB_NAME)` instead of
            # executing anything. That is detectable, and the check below
            # detects it. The same reasoning applies to every inline script in
            # this file that interpolates a variable-group value.
            # ─────────────────────────────────────────────────────────────────
            inputs:
              azureSubscription: slipro-azure-stage
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                JOB="${SCHEDULER_JOB_NAME:-}"

                skip() {
                  echo "##vso[task.logissue type=warning]Scheduler job not updated: $1"
                  echo "$1"
                  echo "Create it once with the command in AZURE_SCHEDULER.md, then re-run."
                  echo "##vso[task.complete result=SucceededWithIssues;]"
                  exit 0
                }

                # An unset pipeline variable reaches here as its own literal.
                case "$JOB" in
                  "" | '$('*)
                    skip "SCHEDULER_JOB_NAME is not set in the slipro-stage variable group." ;;
                esac

                # Checked by what comes BACK, not by the exit code.
                #
                # `az containerapp job show --name ""` exits 0, which is how the
                # old guard let an empty name through to `update`. Requiring the
                # command to return the job's own name is a test the missing
                # case cannot pass.
                FOUND=$(az containerapp job show \
                  --name "$JOB" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query name -o tsv 2>/dev/null || true)

                if [ -z "$FOUND" ]; then
                  skip "No Container Apps job named '$JOB' in resource group '$RESOURCE_GROUP'."
                fi

                # Past this point the job exists, so anything that fails is a
                # real failure and the stage should go red for it.
                az containerapp job update \
                  --name "$JOB" \
                  --resource-group "$RESOURCE_GROUP" \
                  --image "$JOB_IMAGE"

                # What the schedule actually is, in the deploy log, so a cron
                # somebody changed in the portal is visible here rather than
                # only in the portal.
                az containerapp job show \
                  --name "$JOB" \
                  --resource-group "$RESOURCE_GROUP" \
                  --query "{cron:properties.configuration.scheduleTriggerConfig.cronExpression, \
                            parallelism:properties.configuration.scheduleTriggerConfig.parallelism, \
                            retries:properties.configuration.replicaRetryLimit}" \
                  -o table
            env:
              # Resolved by Azure DevOps into the environment, never into the
              # script text — see the note above.
              SCHEDULER_JOB_NAME: $(SCHEDULER_JOB_NAME)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              JOB_IMAGE: $(ACR_NAME).azurecr.io/$(imageName):$(imageTag)
