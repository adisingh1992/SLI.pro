<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No maximum-scale. It was there to stop iOS zooming on input focus, which
      it does not do (iOS has ignored it since iOS 10) — while Android Chrome
      does honour it, disabling pinch-zoom and failing WCAG 1.4.4. The zoom
      problem is fixed properly in index.css by setting form controls to 16px.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wing - Professional Profile Management</title>
    <link rel="icon" type="image/png" href="/src/assets/sli-pro-favicon.png" />
    <!--
      Fonts, tuned for the B5 target of under three seconds on cellular.

      preconnect first: the stylesheet lives on fonts.googleapis.com but the
      font files come from fonts.gstatic.com, so without warming BOTH the
      browser pays two fresh DNS + TLS handshakes on a mobile connection before
      any text can render. crossorigin is required on the gstatic hint — font
      fetches are CORS requests, and a non-CORS preconnect opens a connection
      the font request cannot reuse.

      One combined request instead of two: the previous pair of stylesheets were
      two serial round trips to the same host for no reason.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;500;600&family=Lora:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      The Replit badge script used to load here. Removed: the platform runs on
      Azure now, so it was a third-party request to replit.com on every page
      load — latency on the critical path we are trying to keep under three
      seconds on cellular, and an external script injecting into a page
      Berkeley and Vanderbilt students use.
    -->
  </body>
</html>
